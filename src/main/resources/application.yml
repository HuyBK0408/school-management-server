spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school}
    username: ${DB_USER:school}
    password: ${DB_PASS:school}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none              # KHÔNG create/update schema lúc runtime
    open-in-view: false
    properties:
      hibernate.jdbc.lob.non_contextual_creation: true
      hibernate.format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      schema-locations: file:./schema.sql
      # data-locations: classpath:data.sql, classpath:recompute.sql
      continue-on-error: true

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USER:3e576d8785d1cd}
    password: ${MAIL_PASS:f4f55bd8b398a3}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.trust: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
      mail.debug: ${MAIL_DEBUG:true}

  security:
    jwt:
      secret: ${JWT_SECRET:CHANGE_THIS_SUPER_SECRET_64_BYTES_MINIMUM_0123456789abcdef0123456789abcdef}
      issuer: ${JWT_ISS:school-api}           # THÊM: iss để Resource Server validate
      audience: ${JWT_AUD:web}                # THÊM: aud để Resource Server validate
      access-minutes: ${JWT_ACCESS_MINUTES:500}
      refresh-days: ${JWT_REFRESH_DAYS:7}
      clock-skew-seconds: ${JWT_CLOCK_SKEW_SECONDS:30}  # THÊM: chống lệch giờ nhẹ

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}

# App-level (đưa ra top-level cho rõ ràng)
app:
  mail:
    from: ${MAIL_FROM:no-reply@school.local}
    mock: ${MAIL_MOCK:false}
  upload:
    base-dir: ${UPLOAD_BASE_DIR:D:/school_uploads}
    public-prefix: ${UPLOAD_PUBLIC_PREFIX:/files}
  cors:
    origins: ${CORS_ORIGINS:*}    # ví dụ: https://admin.example.com,https://client.example.com

security:
  login:
    reveal-detail: ${LOGIN_REVEAL_DETAIL:false}

# Tuỳ chọn log SQL (chỉ bật khi dev)
logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:off}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_SQL_BIND_LOG:off}
    huy.example.demoMonday.service.AcademicProbationService: debug
    huy.example.demoMonday.service.EmailService: debug
    org.springframework.mail: info
    javax.mail: info
google:
  # Service Account (fallback hoặc dùng cho Shared Drive)
  drive:
    service-account-key-path: classpath:drive-sa.json   # <— ĐÚNG: 1 .json
    upload-folder-id: ""                                 # để trống = My Drive gốc (chỉ khi dùng OAuth)
    application-name: "SchoolManagement"

  # OAuth (gmail cá nhân): ưu tiên dùng để upload vào My Drive (có quota)
  oauth:
    enabled: true
    client-secret-path: classpath:drive-oauth.json       # file OAuth client (bạn tạo theo hướng dẫn trước)
    redirect-uri: "http://localhost:8080/api/v1/google/drive/oauth2/callback"


